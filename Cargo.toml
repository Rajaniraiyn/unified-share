[package]
name = "unified-share"
version = "0.3.0"
edition = "2024"
description = "A small, adapter-driven nearby sharing core for Linux desktops"
license = "GPL-3.0-only"
repository = "https://github.com/Rajaniraiyn/unified-share"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.3"
tiny_http = "0.12"
tokio = { version = "1.43", features = ["rt-multi-thread", "time"] }
rqs_lib = { git = "https://github.com/Rajaniraiyn/rquickshare.git", rev = "d75ce9b", default-features = false, features = ["experimental"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
